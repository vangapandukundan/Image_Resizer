<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖼️ Image Resizer Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Step 1: Home Page */
        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-title {
            font-size: 5em;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .home-subtitle {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-zone {
            border: 4px dashed #667eea;
            border-radius: 20px;
            padding: 80px 40px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-zone:hover {
            border-color: #764ba2;
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }

        .upload-zone.dragover {
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.2);
            transform: scale(1.05);
        }

        .upload-text {
            font-size: 2em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
        }

        .upload-subtext {
            font-size: 1.3em;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        /* Step 2: Size Selection */
        .size-title {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 50px;
            color: #667eea;
        }

        .preview-image {
            max-width: 400px;
            max-height: 400px;
            border-radius: 15px;
            margin: 0 auto 40px;
            display: block;
            border: 3px solid #667eea;
        }

        .size-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .size-btn {
            padding: 30px;
            background: rgba(102, 126, 234, 0.1);
            border: 3px solid #667eea;
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .size-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translateY(-5px);
        }

        .custom-size {
            margin-top: 30px;
        }

        .custom-size h3 {
            font-size: 2em;
            margin-bottom: 30px;
            color: #764ba2;
        }

        .dimension-inputs {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .input-box {
            flex: 1;
            max-width: 250px;
        }

        .input-box label {
            display: block;
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #999;
        }

        .input-box input {
            width: 100%;
            padding: 20px;
            font-size: 2em;
            background: rgba(102, 126, 234, 0.1);
            border: 3px solid #667eea;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .input-box input:focus {
            outline: none;
            border-color: #764ba2;
            background: rgba(118, 75, 162, 0.2);
        }

        .process-btn {
            padding: 25px 60px;
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .process-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.5);
        }

        .process-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Step 3: Complete */
        .complete-title {
            font-size: 4em;
            margin-bottom: 30px;
        }

        .complete-message {
            font-size: 2em;
            color: #999;
            margin-bottom: 50px;
        }

        .download-info {
            background: rgba(102, 126, 234, 0.1);
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .filename {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .file-details {
            font-size: 1.5em;
            color: #999;
        }

        .reset-btn {
            padding: 20px 50px;
            font-size: 1.8em;
            background: transparent;
            border: 3px solid #667eea;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: scale(1.05);
        }

        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 60px;
            height: 60px;
            font-size: 60px;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
            z-index: 1000;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Step 1: Upload -->
        <div class="step active" id="step1">
            <div class="home-title">🖼️</div>
            <div class="home-subtitle">Image Resizer Tool</div>
            
            <div class="upload-zone" id="uploadZone">
                <div class="upload-text">Click to Upload</div>
                <div class="upload-subtext">or drag and drop your image here</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <!-- Step 2: Size Selection -->
        <div class="step" id="step2">
            <h2 class="size-title">Choose Size</h2>
            
            <img id="previewImg" class="preview-image" src="" alt="Preview">
            
            <div class="size-options">
                <button class="size-btn" onclick="setSize(800, 600)">
                    800 × 600<br>
                    <small style="font-size: 0.6em; color: #999;">Standard</small>
                </button>
                <button class="size-btn" onclick="setSize(1920, 1080)">
                    1920 × 1080<br>
                    <small style="font-size: 0.6em; color: #999;">Full HD</small>
                </button>
                <button class="size-btn" onclick="setSize(1280, 720)">
                    1280 × 720<br>
                    <small style="font-size: 0.6em; color: #999;">HD</small>
                </button>
                <button class="size-btn" onclick="setSize(500, 500)">
                    500 × 500<br>
                    <small style="font-size: 0.6em; color: #999;">Square</small>
                </button>
            </div>

            <div class="custom-size">
                <h3>Or Enter Custom Dimensions</h3>
                
                <div class="dimension-inputs">
                    <div class="input-box">
                        <label>Width</label>
                        <input type="number" id="widthInput" value="800" min="1">
                    </div>
                    <div style="font-size: 2em; color: #667eea;">×</div>
                    <div class="input-box">
                        <label>Height</label>
                        <input type="number" id="heightInput" value="600" min="1">
                    </div>
                </div>

                <button class="process-btn" onclick="resizeAndDownload()">Resize & Download</button>
            </div>
        </div>

        <!-- Step 3: Complete -->
        <div class="step" id="step3">
            <div class="complete-title">🎉</div>
            <div class="complete-message">Image Resized Successfully!</div>
            
            <div class="download-info">
                <div class="filename" id="downloadedFilename"></div>
                <div class="file-details" id="fileDetails"></div>
            </div>

            <button class="reset-btn" onclick="resetApp()">Resize Another Image</button>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let currentStep = 1;

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');

        // Upload zone click
        uploadZone.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();
            
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                goToStep(2);
            };
            
            reader.readAsDataURL(file);
        }

        function setSize(width, height) {
            widthInput.value = width;
            heightInput.value = height;
        }

        function goToStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${step}`).classList.add('active');
            currentStep = step;
        }

        async function resizeAndDownload() {
            const width = parseInt(widthInput.value) || 800;
            const height = parseInt(heightInput.value) || 600;

            const resizedBlob = await resizeImage(selectedFile, width, height);
            
            // Download
            const url = URL.createObjectURL(resizedBlob);
            const a = document.createElement('a');
            const newFilename = `RESIZED_${width}x${height}_${selectedFile.name}`;
            a.href = url;
            a.download = newFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Show complete screen
            document.getElementById('downloadedFilename').textContent = newFilename;
            document.getElementById('fileDetails').textContent = 
                `${width} × ${height} pixels • ${(resizedBlob.size / 1024).toFixed(1)} KB`;
            
            goToStep(3);
        }

        function resizeImage(file, width, height) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const img = new Image();
                    
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, file.type);
                    };
                    
                    img.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            });
        }

        function resetApp() {
            selectedFile = null;
            fileInput.value = '';
            previewImg.src = '';
            widthInput.value = 800;
            heightInput.value = 600;
            goToStep(1);
        }
    </script>
</body>
</html>
